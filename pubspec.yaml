name: pictolog
description: "Pictolog — photo project journals and PDF export."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  camera: ^0.11.3
  image_cropper: ^8.0.2
  path_provider: ^2.1.5
  path: ^1.9.1
  flutter_hooks: ^0.21.3+1
  go_router: ^17.0.1
  hooks_riverpod: ^3.1.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  image_picker: ^1.2.1
  flutter_riverpod: ^3.1.0
  pdf: ^3.11.3
  printing: ^5.14.2
  google_fonts: ^6.1.0
  shared_preferences: ^2.3.3
  image: ^4.5.4
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.14.4


flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/app_icon.png"
  adaptive_icon_foreground: "assets/app_icon.png"
  adaptive_icon_background: "#ffffff"


flutter:
  uses-material-design: true
  generate: true
